services:
  narrative-ai:
    image: ghcr.io/moroxarhont/narrative-ai:latest
    container_name: narrative-ai
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: narrative-ai-nginx
    depends_on:
      - narrative-ai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
